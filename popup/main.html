<!DOCTYPE html>
<html>
	<head>
		<style>
			body{
				border-style: outset;
				border-width: 10px;
				border-color: white;
				width: 360px;
				padding: 50px;
				padding-top: 10px;
			}

			.buttons{
				display: flex;
				gap:10px;
			}
			.button{
				border-style: solid;
				padding-left: 5px;
				padding-right: 5px;
			}
			img{
				position: fixed;
				bottom: 20px;
				right: 20px;

			}
		</style>
	</head>
	<body>
		<h1>UnscrewIt!</h1>
		<p>To activate :</p> 
		<div class = "buttons">
			<div class = "button">ctrl</div>
			<div class = "button">alt</div>
			<div class = "button">u</div>
		</div>

		<p>To exit:</p>
		<div class = "buttons">
			<div class = "button">Esc</div>
		</div>
		<p>Use the slider to select the elements by level then click Unscrew. Enjoy!</p>
		<img src = "dude.png" height = "30px"></img>
	</body>
</html>
